[package]
description = "Gds21 Integrated Circuit Layout Parser & Writer"
name = "gds21"
# Shared layout21 attributes
authors = ["Dan Fritchman <dan@fritch.mn>"]
edition = "2018"
license = "BSD-3-Clause"
repository = "https://github.com/dan-fritchman/Layout21"
version = "0.2.1"
workspace = "../../"
exclude = ["resources",]

[dependencies]
byteorder = "1.4.3"
chrono = { version = "0.4.24", features = ["serde"] }
derive_builder = "0.20.2"
derive_more = "2.1.1"
num-derive = "0.5"
num-traits = "0.2.15"
serde = { version = "1.0.159", features = ["derive"] }
serde_derive = "1.0.159"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1.6"
tempfile = { version = "3", optional = true }
arcstr = { version = "1.1.5", features = ["serde"] }
textwrap = "0.16.4"

[dev-dependencies]
tempfile = {version = "3"}

[features]
selftest = ["tempfile"]
